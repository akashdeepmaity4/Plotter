<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLOTTER</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div id="controls">
        <button class="tool-button active" data-tool="select" aria-pressed="true">Select</button>
        <button class="tool-button" data-tool="freehand" aria-pressed="false">Draw</button>
        <button class="tool-button" data-tool="rectangle" aria-pressed="false">Rectangle</button>
        <button class="tool-button" data-tool="ellipse" aria-pressed="false">Ellipse</button>
        <button class="tool-button" data-tool="line" aria-pressed="false">Line</button>
        <button class="tool-button" data-tool="connector" aria-pressed="false">Connector</button>
        <button class="tool-button" data-tool="text" aria-pressed="false">Text</button>
        <button id="saveBtn">Save to Host</button>
    </div>

    <canvas id="paintCanvas"></canvas>

    <script src="{{ url_for('static', filename='fabric.min.js') }}"></script>
    <script src="{{ url_for('static', filename='canvas.js') }}"></script>
</body>

</html>
